apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netweather
  namespace: netweather
  labels:
    app.kubernetes.io/name: netweather
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netweather
                port:
                  name: http
