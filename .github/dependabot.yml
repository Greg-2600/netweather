version: 2

# Grouped weekly updates: one pull request per ecosystem, so a security fix in a
# transitive module does not arrive as twenty separate reviews. The release
# workflow signs whatever is built from the merged revision.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /deploy/azure/terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
