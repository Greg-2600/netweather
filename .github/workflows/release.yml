name: release

# Tag-triggered release build. The image is multi-arch, signed keyless with
# cosign, and carries SBOM and provenance attestations (docs/IMAGE.md §6), so a
# user can verify what they run instead of trusting a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing through Fulcio
  attestations: write # buildx provenance attestation

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: normalize the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: version metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          # mode=max keeps the full build graph; sbom attaches an SPDX SBOM to
          # the pushed manifest list.
          provenance: mode=max
          sbom: true

      - name: generate an SBOM for the signed attestation
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: netweather-sbom.spdx.json
          artifact-name: netweather-sbom.spdx.json

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: attach the SBOM as a signed attestation
        run: |
          cosign attest --yes --type spdxjson \
            --predicate netweather-sbom.spdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Advisory on purpose: a base-image CVE we cannot fix yet should be
      # visible in the run, not a reason to publish nothing at all.
      - name: scan the image (advisory)
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high

      - name: upload the scan report
        if: always() && steps.scan.outputs.sarif != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: ignore

      - name: write the release summary
        run: |
          {
            echo "## netweather ${{ steps.meta.outputs.version }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Verify before running:"
            echo '```sh'
            echo "cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The debug variant (docs/IMAGE.md §1): the same binary with a shell and
  # network tools. It is a second tag on the same repository, built from the
  # same Dockerfile with `target: debug`, and signed like the release image so
  # an operator can verify the image they use to look around.
  debug-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: normalize the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: version metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push the debug image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debug
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-debug
            ${{ env.IMAGE }}:latest-debug
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sign the debug image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: write the debug summary
        run: |
          {
            echo "## netweather debug ${{ steps.meta.outputs.version }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "The debug tag has a shell and network tools; it is not the release image."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Tor sidecar is published too (docs/IMAGE.md 3 and 7). Compose builds it
  # locally by default, but a pinned, signed image is what a deployment that
  # mirrors the compose file should run.
  tor-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: normalize the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: version metadata
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push the sidecar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-tor:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}-tor:latest
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: sign the sidecar
        run: cosign sign --yes "${IMAGE}-tor@${{ steps.build.outputs.digest }}"

      - name: write the sidecar summary
        run: |
          {
            echo "## netweather-tor ${{ steps.meta.outputs.version }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
