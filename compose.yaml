name: netweather

services:
  netweather:
    # In production, pin the digest instead of a tag:
    #   image: ghcr.io/<owner>/netweather@sha256:<digest>
    # The release job prints the digest and the cosign verify command for each
    # tag; the signature is keyless and the image carries SBOM and provenance
    # attestations (docs/IMAGE.md §6).
    image: ghcr.io/${NETWEATHER_OWNER:-greg-2600}/netweather:${NETWEATHER_TAG:-latest}
    build: .
    networks: [ui, egress]

    # Inbound is the dashboard only. Auth is mandatory for a non-loopback bind.
    ports: ["2600:2600"]

    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./secrets/ui_token:/run/secrets/ui_token:ro

    environment:
      NETWEATHER_UI_LISTEN: 0.0.0.0:2600
      NETWEATHER_UI_TOKEN_FILE: /run/secrets/ui_token
      NETWEATHER_DATA: /data
      NETWEATHER_LOG_LEVEL: info
      # Daily egress budget for the direct vantage. Counted on every probe and
      # self-check connection; 2048 MB is the documented default and 0 disables
      # it. When spent, probing stops until 00:00 UTC and the board says so.
      # NETWEATHER_DAILY_MB: "2048"
      # The built-in default is the full 1000-target field-trial fleet
      # (config/fieldtrial-targets.yaml). Point NETWEATHER_CONFIG at another
      # file or a directory to replace it.
      # NETWEATHER_CONFIG: /config/targets.yaml
      #
      # The default install turns on the unpinned Tor corroboration vantage
      # against the sidecar service below. Set NETWEATHER_TOR to false to run
      # direct only; the pinned regional sidecars remain opt-in under the tor
      # profile.
      NETWEATHER_TOR: "true"
      NETWEATHER_TOR_SOCKS: tor:9050
      # Daily volume budget for the tor vantage. Counted on the SOCKS
      # connection; 0 disables it.
      # NETWEATHER_TOR_DAILY_MB: "50"
      # Declare the exit's country to label the vantage tor-<cc>. It is
      # verified through the proxy; a mismatch refuses to start the vantage.
      # NETWEATHER_TOR_EXIT_COUNTRY: "US"
      #
      # External corroboration, also off by default.
      # NETWEATHER_FEEDS: ioda,radar,statuspage,aws-status,gcp-status,azure-status,ris-live
      # NETWEATHER_STATUSPAGE_URLS: https://status.example.com,https://status.other.example
      # ris-live needs NETWEATHER_RIS_ASNS (comma-separated public ASNs) and
      # reads RIPEstat; see compose.fieldtrial.yaml for the verified operator
      # list. Its rows are IP-routing corroboration, not voice/SMS health.
      # Radar also needs a token; it is skipped with a warning without one.
      # NETWEATHER_RADAR_TOKEN: /run/secrets/radar_token is not supported; use env or a secret-aware wrapper.

    depends_on:
      - tor

    read_only: true
    tmpfs: [/tmp]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    # Unprivileged ICMP; no NET_RAW, no NET_ADMIN.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "/netweather", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Tor corroboration is part of the default install. The sidecar is
  # client-only (the monitor never embeds Tor) and publishes no port.
  #
  # `tor` is the unpinned proxy for the single `NETWEATHER_TOR` vantage above.
  # The release workflow builds and signs ghcr.io/<owner>/netweather-tor from
  # Dockerfile.tor, and both images use the same NETWEATHER_TAG.
  #
  # The `tor-<cc>` services below are opt-in under the tor profile. Each builds
  # its own client-only image with a pinned exit country, then
  # `NETWEATHER_TOR_VANTAGES` names the SOCKS endpoints. A country label is only
  # trusted after the monitor checks the real exit through that proxy
  # (docs/ACCEPTABLE_USE.md §8).
  # Field-trial list:
  # DE=tor-de:9050,JP=tor-jp:9050,AU=tor-au:9050,
  # SG=tor-sg:9050,CL=tor-cl:9050,MX=tor-mx:9050
  tor:
    image: ghcr.io/${NETWEATHER_OWNER:-greg-2600}/netweather-tor:${NETWEATHER_TAG:-latest}
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Six pinned exits across five continents. Each service is a separate Tor
  # client with its own DataDirectory inside the container, so its circuit
  # selection cannot leak into another vantage. These countries were chosen
  # because they had reachable exits at field-trial time; the monitor skips any
  # exit that cannot be verified rather than labeling it by intention.
  tor-de:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: DE
    image: netweather-tor-de:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tor-jp:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: JP
    image: netweather-tor-jp:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tor-au:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: AU
    image: netweather-tor-au:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tor-sg:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: SG
    image: netweather-tor-sg:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tor-cl:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: CL
    image: netweather-tor-cl:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tor-mx:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        TOR_EXIT_COUNTRY: MX
    image: netweather-tor-mx:local
    profiles: [tor]
    networks: [egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional tailnet access. Sidecar, never a namespace share: coupling the
  # access plane to the measurement plane means an exit node silently changes
  # every probe's egress (docs/NETWORKING.md §7.2). The default file still
  # publishes 2600; remove that line when using this profile.
  #
  #   docker compose --profile tailscale up -d
  #   docker compose exec tailscale tailscale serve --bg http://netweather:2600
  tailscale:
    image: ghcr.io/tailscale/tailscale:latest
    profiles: [tailscale]
    networks: [ui]
    restart: unless-stopped
    environment:
      TS_AUTHKEY_FILE: /run/secrets/ts_authkey
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true" # no /dev/net/tun, no host device mount
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./secrets/ts_authkey:/run/secrets/ts_authkey:ro
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]

  # RIPE Atlas is RIPE's daemon measuring for RIPE's network, from this host,
  # under RIPE's terms. It is a separate trust domain and a separate
  # agreement (docs/ACCEPTABLE_USE.md, docs/THREAT_MODEL.md §5.7). netweather
  # never talks to its socket and never wraps it.
  #
  #   docker compose --profile ripe-atlas up -d
  #
  # Verify the image tag against RIPE's current instructions before enabling:
  # the probe needs CAP_NET_RAW and a probe key issued by RIPE.
  # Optional RIPE Atlas software probe (docs/RIPE_ATLAS.md). RIPE's daemon, not
  # ours: host networking and raw sockets are what it needs to measure from the
  # host address. Off by default, and netweather never reads from it.
  ripe-atlas:
    image: ghcr.io/ripe-atlas/ripe-atlas-probe:latest   # verify the tag against RIPE's docs
    profiles: [ripe-atlas]
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/ripe-atlas:/var/atlas-probe
    tmpfs: [/tmp]

networks:
  ui:
  egress:
    driver_opts:
      # VPN uplinks and some ISPs are not 1500; see docs/NETWORKING.md §4.
      com.docker.network.driver.mtu: 1400
