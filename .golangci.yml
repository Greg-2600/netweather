version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gosec
    - noctx
    - testpackage
  settings:
    exhaustive:
      # A default arm is how forward-compatible enum switches are written here.
      default-signifies-exhaustive: true
    testpackage:
      # main packages and the unexported token-bucket test stay in-package.
      skip-regexp: "(main|export_test|ratelimit_test)\\.go"
  exclusions:
    rules:
      # Tests are short-lived and use fixtures with deliberately odd permissions
      # and credentials; noctx/gosec add noise without a real risk.
      - path: _test\.go
        linters:
          - noctx
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
    - gci
