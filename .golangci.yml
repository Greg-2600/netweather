version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gosec
    - noctx
    - testpackage
  settings:
    testpackage:
      # main packages are tested in-package so run() stays callable without exporting it.
      skip-regexp: "(main|export_test)\\.go"

formatters:
  enable:
    - gofmt
    - goimports
    - gci
