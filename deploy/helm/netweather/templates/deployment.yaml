apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netweather
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 2600
          env:
            - name: NETWEATHER_TOKEN
              value: {{ .Values.env.NETWEATHER_TOKEN | quote }}
            - name: NETWEATHER_DATA
              value: {{ .Values.env.NETWEATHER_DATA | quote }}
            {{- if .Values.tor.enabled }}
            - name: NETWEATHER_TOR
              value: "true"
            - name: NETWEATHER_TOR_SOCKS
              value: "127.0.0.1:9050"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- if .Values.tor.enabled }}
        - name: tor
          image: "{{ .Values.tor.image.repository | default (printf "%s-tor" .Values.image.repository) }}:{{ .Values.tor.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.tor.image.pullPolicy }}
          resources: {{ toYaml .Values.tor.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
