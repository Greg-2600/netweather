version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gosec
    - noctx
    - testpackage
  settings:
    testpackage:
      # main packages and the unexported token-bucket test stay in-package.
      skip-regexp: "(main|export_test|ratelimit_test)\\.go"

formatters:
  enable:
    - gofmt
    - goimports
    - gci
