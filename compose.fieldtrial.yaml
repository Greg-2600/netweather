# Field-trial overlay for compose.yaml.
#
#   docker compose -f compose.yaml -f compose.fieldtrial.yaml up -d --build
#
# The base file supplies the hardened runtime (read-only root, uid 65532,
# dropped capabilities, healthcheck, restart policy, unprivileged ICMP), the
# 1000-target fleet, and the six pinned Tor vantages. This overlay sets the
# bounded evidence feeds and points auth at a real 0600 secret (a Docker named
# volume, because a Windows bind mount cannot carry Unix mode 0600).
services:
  netweather:
    image: netweather:local
    environment:
      NETWEATHER_CONFIG: /config/fieldtrial-targets.yaml
      NETWEATHER_TOR: "true"
      # Six pinned Tor exits provide corroboration from five continents. Each
      # entry is CC=SOCKS endpoint and is verified through that proxy before
      # the country label is used. One unavailable exit is skipped; the rest
      # keep running.
      NETWEATHER_TOR_VANTAGES: "DE=tor-de:9050,JP=tor-jp:9050,AU=tor-au:9050,SG=tor-sg:9050,CL=tor-cl:9050,MX=tor-mx:9050"
      # One extra UDP attempt on timeout, inside the existing 5s DNS budget, so
      # a lost datagram does not flip a healthy DNS anchor to DOWN. Negative
      # answers are never retried (docs/ACCEPTABLE_USE.md).
      NETWEATHER_DNS_RETRIES: "1"
      NETWEATHER_DNS_RETRY_DELAY_MS: "25"
      NETWEATHER_CONTACT: "field-trial-operator@example.invalid"
      NETWEATHER_UI_TOKEN_FILE: /run/secrets-prod/ui_token
      # Bounded country-level overlay for /world plus zero-infrastructure
      # telephony-adjacent evidence. IODA polls one ranked summary every five
      # minutes (at most 25 countries); Statuspage polls three verified public
      # JSON feeds; RIS Live polls RIPEstat for the operator ASNs below. Pages
      # never call any of them. The real-time RIS WebSocket stays opt-in via
      # NETWEATHER_RIS_STREAM=true, so a field trial is not silently left
      # holding an open connection to a third-party BGP firehose.
      NETWEATHER_FEEDS: "ioda-level,statuspage,ris-live"
      # Verified public Statuspage summary endpoints. Verizon's page lists
      # example-scoped components, so it is kept as provider-reported evidence
      # only and is not mapped to a target's status_url. No AT&T, T-Mobile,
      # Telstra, Vodafone, Orange, Telefonica, Docomo, or SK Telecom JSON feed
      # was verified, so none is guessed here.
      NETWEATHER_STATUSPAGE_URLS: "https://status.twilio.com/api/v2/summary.json,https://status.telnyx.com/api/v2/summary.json,https://verizon.statuspage.io/api/v2/summary.json"
      # Public ASNs verified through RIPEstat as-overview. These are operator
      # IP networks, not SMS/PSTN infrastructure: BGP rows are IP-routing
      # corroboration and never a measured voice or messaging health signal.
      # 7018 AT&T, 701 Verizon Business, 21928 T-Mobile USA, 1221 Telstra,
      # 5378 Vodafone Limited, 3215 Orange, 3352 Telefonica de Espana,
      # 4713 NTT Docomo Business, 9644 SK Telecom.
      NETWEATHER_RIS_ASNS: "7018,701,21928,1221,5378,3215,3352,4713,9644"
    volumes:
      - nw-fieldtrial-secret:/run/secrets-prod:ro
    depends_on:
      - tor-de
      - tor-jp
      - tor-au
      - tor-sg
      - tor-cl
      - tor-mx

volumes:
  nw-fieldtrial-secret:
    # The deploy script creates and seeds this exact volume. Without an explicit
    # name Compose prefixes it with the project name and mounts an empty volume.
    # External keeps `down` from deleting the token between two-hour deploys.
    name: nw-fieldtrial-secret
    external: true
