name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new advisories and a fresh toolchain

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: format
        run: go run ./internal/devtool fmt -check

      - name: modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: vet
        run: go vet ./...

      - name: test (race, shuffled)
        run: go run ./internal/devtool test

      - name: coverage gates
        run: go run ./internal/devtool cover

      - name: fuzz (short)
        run: |
          go test -run=^$ -fuzz=FuzzScrubStringIsIdempotent -fuzztime=10s ./internal/logging
          go test -run=^$ -fuzz=FuzzParseLevel -fuzztime=5s ./internal/logging
          go test -run=^$ -fuzz=FuzzParse -fuzztime=10s ./internal/config
          go test -run=^$ -fuzz=FuzzClassify -fuzztime=10s ./internal/classify
          go test -run=^$ -fuzz=FuzzRank -fuzztime=10s ./internal/correlate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned in go.mod as a tool directive: the same version as a laptop.
      - name: lint
        run: go tool golangci-lint run

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck (pinned in go.mod)
        run: go tool govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed from HEAD is still a leaked secret.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned in the workflow rather than go.mod: this is a scanner, not a
      # package the binary builds against (QUALITY.md §8).
      - name: gitleaks (pinned)
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both images: the release image has no shell but still has a Dockerfile
      # with a base image, a user, and a copy list (THREAT_MODEL.md T63).
      - name: lint the release Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

      - name: lint the Tor sidecar Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile.tor

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build (static, version stamped)
        run: go run ./internal/devtool build

      - name: reproducible build
        run: go run ./internal/devtool repro

      - name: verify the binary runs
        run: ./dist/netweather version

      - name: release artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: go run ./internal/devtool snapshot

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-binaries
          path: |
            dist/*
          retention-days: 30

  uitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install browser
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6401.0 install --with-deps chromium

      - name: browser tests
        run: go run ./internal/devtool ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: uitest-artifacts
          path: testdata/out/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build image
        run: docker build -t netweather:ci .

      - name: run hardened
        run: |
          docker run -d --name nw-ci -p 127.0.0.1:2606:2600 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e NETWEATHER_UI_TOKEN=ci-token-0123456789 \
            -e NETWEATHER_SEED=none \
            -v nw-ci-data:/data \
            netweather:ci

      - name: healthz answers
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2606/healthz; then exit 0; fi
            sleep 1
          done
          docker logs nw-ci
          exit 1

      - name: runs as the release uid
        run: test "$(docker inspect --format '{{.Config.User}}' nw-ci)" = "65532:65532"

      - name: no shell in the image
        run: |
          if docker exec nw-ci sh -c true 2>/dev/null; then
            echo "release image has a shell"; exit 1
          fi

      - name: cleanup
        if: always()
        run: |
          docker rm -f nw-ci || true
          docker volume rm nw-ci-data || true

  # The network-plane suite (QUALITY.md 5.5). Separate from the image smoke
  # test because it builds real networks, runs a second app on an internal
  # network, and asserts what a container can break. It builds its own image
  # and cleans up every object it creates.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: docker is present
        run: docker info --format '{{.OSType}}' | grep -qx linux

      - name: run the compose network suite
        run: |
          go test -tags=compose -count=1 -run TestComposeNetworkPlane \
            ./internal/e2e -timeout 15m -v

      - name: logs
        if: failure()
        run: |
          for name in nw-compose-app nw-compose-app-internal nw-compose-tor; do
            echo "--- $name ---"
            docker logs --tail 100 "$name" 2>&1 || true
          done

  # Issue #8: the continuous integration image. It is built from the same
  # Dockerfile as the release, after every blocking gate above has passed.
  # Pull requests build it and stop, so a fork can never publish. A push to
  # main publishes it to GHCR with an immutable sha-<commit> tag and a moving
  # main tag. Version tags stay on release.yml, the signed path (IMAGE.md §6).
  image-build:
    if: github.event_name == 'pull_request'
    needs: [quality, lint, vuln, secrets, dockerfile, build, uitest, container, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The commit time, not the wall clock, so a rebuild of one commit carries
      # the same DATE.
      - name: version metadata
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "version=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: netweather:pr-${{ github.event.pull_request.number }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, lint, vuln, secrets, dockerfile, build, uitest, container, compose]
    runs-on: ubuntu-latest
    # The only job in this workflow that may write a package, and only on main.
    permissions:
      contents: read
      packages: write
    # Two quick merges must not race on the moving main tag: the second run
    # waits for the first instead of cancelling it or pushing over it.
    concurrency:
      group: ghcr-main-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names must be lower case; the owner is Greg-2600.
      - name: normalize the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: version metadata
        id: meta
        run: |
          echo "version=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the Azure k3s VM sizes are x86. The multi-arch build is the
      # release job's work.
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: write the image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## netweather CI image"
            echo
            echo "- \`${IMAGE}:sha-${GITHUB_SHA}\`"
            echo "- \`${IMAGE}:main\`"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Mutation testing is advisory (QUALITY.md 5.7): it asks whether the
  # classifier's fixture suite would notice a rule being wrong. It is slow and
  # its findings need judgement, so it never blocks a merge.
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: mutation testing on the classifier (advisory)
        run: go run ./internal/devtool mutate

      - name: upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation.json
          if-no-files-found: ignore
          retention-days: 14
