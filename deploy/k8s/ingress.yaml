apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netweather
  namespace: netweather
  labels:
    app.kubernetes.io/name: netweather
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
    - hosts:
        - netweather.westcountytech.com
  rules:
    - host: netweather.westcountytech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netweather
                port:
                  name: http
