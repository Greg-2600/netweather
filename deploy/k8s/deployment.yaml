apiVersion: apps/v1
kind: Deployment
metadata:
  name: netweather
  namespace: netweather
  labels:
    app.kubernetes.io/name: netweather
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netweather
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netweather
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netweather
          image: ghcr.io/OWNER/netweather:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2600
              protocol: TCP
          env:
            - name: NETWEATHER_UI_LISTEN
              value: "0.0.0.0:2600"
            - name: NETWEATHER_DATA
              value: /data
            # The binary's built-in default is the full 1000-target field-trial
            # fleet. Set NETWEATHER_CONFIG here to override it.
            - name: NETWEATHER_TOR
              value: "true"
            - name: NETWEATHER_TOR_SOCKS
              value: "127.0.0.1:9050"
            - name: NETWEATHER_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netweather-auth
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        # Tor corroboration sidecar. It shares the pod network namespace, so
        # the app reaches it on loopback. It publishes no port and stays
        # client-only through the torrc baked into Dockerfile.tor.
        - name: tor
          image: ghcr.io/OWNER/netweather-tor:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netweather-data
        - name: tmp
          emptyDir: {}
