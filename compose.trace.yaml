# Traceroute overlay. Apply with the base file:
#
#   docker compose -f compose.yaml -f compose.trace.yaml up -d
#
# Traceroute needs raw ICMP sockets, which means CAP_NET_RAW. That is a
# meaningful capability, so it is not granted by the default file: an operator
# who wants path walks opts in here. Everything else keeps working without it.
name: netweather

services:
  netweather:
    cap_add:
      - NET_RAW
    environment:
      # The capability is not consent: tracing stays off until this is true, and
      # the API answers 503 explaining the opt-in when it is not. Both halves
      # live in this one file so enabling raw sockets is a visible choice.
      NETWEATHER_TRACE_ENABLED: "true"
